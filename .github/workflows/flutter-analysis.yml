name: Flutter Analysis

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # versi Flutter project kamu

      - run: flutter pub get

      # Jalankan analyzer dengan output SARIF
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings --format=sarif > results.sarif

      # Upload SARIF ke GitHub (wajib untuk DeepSource bisa ambil)
      - uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
