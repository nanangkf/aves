name: Flutter Analyze

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # ganti sesuai versi projectmu

      # Install dependencies
      - run: flutter pub get

      # Run analyzer & simpan hasil dalam format SARIF
      - run: flutter analyze --format=sarif > results.sarif

      # Upload SARIF ke GitHub (DeepSource akan membaca ini)
      - uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
